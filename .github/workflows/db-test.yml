name: DB tests

on:
  push:
    branches: [main, db-scale]
    paths-ignore:
      - '**.css'
      - '**.md'
      - 'public/**'
      - 'bot/**'
      - 'gateway/**'
      - 'promo/**'
      - '.github/workflows/gateway.yml'
      - '.github/workflows/bot.yml'
      - '.github/workflows/promo.yml'
      - '.github/workflows/lockfile-update.yml'
  pull_request:
    paths-ignore:
      - '**.css'
      - '**.md'
      - 'public/**'
      - 'bot/**'
      - 'gateway/**'
      - 'promo/**'
      - '.github/workflows/gateway.yml'
      - '.github/workflows/bot.yml'
      - '.github/workflows/promo.yml'
      - '.github/workflows/lockfile-update.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # the suite outgrew 10 minutes: the run was killed mid-suite before the new tests ever ran
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vtx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/vtx_test
      PRICE_FEED: static
      SESSION_SECRET: ci-session-secret-not-used-in-production
      REQUIRE_AUTH: '0' # sign-in is required by default; many tests call routes with no session and expect the demo user
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
