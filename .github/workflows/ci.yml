name: CI

on:
  push:
    branches: [main, db-scale]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.role }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: [all, web, api]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ matrix.role }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'public/**', 'middleware.js', 'instrumentation.js', 'next.config.mjs', 'jsconfig.json') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ matrix.role }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          APP_ROLE: ${{ matrix.role }}
