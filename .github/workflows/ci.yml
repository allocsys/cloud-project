name: CI

on:
  push:
    branches: [main, db-scale]
    paths-ignore:
      - 'bot/**'
      - 'gateway/**'
      - 'promo/**'
      - '**.md'
      - '.github/workflows/gateway.yml'
      - '.github/workflows/bot.yml'
      - '.github/workflows/promo.yml'
      - '.github/workflows/lockfile-update.yml'
  pull_request:
    paths-ignore:
      - 'bot/**'
      - 'gateway/**'
      - 'promo/**'
      - '**.md'
      - '.github/workflows/gateway.yml'
      - '.github/workflows/bot.yml'
      - '.github/workflows/promo.yml'
      - '.github/workflows/lockfile-update.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.role }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: [all, web, api]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ matrix.role }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'public/**', 'middleware.js', 'instrumentation.js', 'next.config.mjs', 'jsconfig.json') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ matrix.role }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          APP_ROLE: ${{ matrix.role }}

  # The tests that read the source tree need no database, so they run on every change, page-only ones included.
  # db-test.yml skips page-only changes (see its paths-ignore); these four are the ones that look at pages, components and css.
  static:
    name: static tests (no database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test --import ./tests/register.mjs tests/boundary.test.mjs tests/no-reduced-motion.test.mjs tests/railway-watch.test.mjs tests/rules.test.mjs
