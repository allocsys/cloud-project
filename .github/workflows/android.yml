name: Android app

# Builds the Android shell for vertexhash.com (Capacitor, loads the live site).
# The android/ project is generated here, not stored in git.
# Always: release APK, signed only when the keystore secrets exist (see below); without them it stays unsigned.
# Debug APK (install on a phone to test): only on pull requests, or when there are no signing secrets.
# No AAB yet (only needed for the Play Store).
# Download from the run page: Artifacts.
# A signed build on main is also published as a GitHub release (tag app-v<versionCode>): the app file, a patch from the
# previous release and manifest.json. The site (/api/app-update) reads that, and the app updates itself from it.
# With the APK_S3_* secrets the same files also go to the Railway bucket (latest.json last); downloads then come from there.
# After each upload only the newest 3 app-v<n>/ folders stay in the bucket; older ones are deleted (GitHub releases are not touched).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build apk and aab
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android-app
    env:
      SITE_URL: https://vertexhash.com
      # Optional secrets for signing. Without them the release files stay unsigned.
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # The Railway bucket for the app files (optional until set).
      ENDPOINT: ${{ secrets.APK_S3_ENDPOINT }}
      BUCKET: ${{ secrets.APK_S3_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.APK_S3_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.APK_S3_SECRET }}
      AWS_DEFAULT_REGION: ${{ secrets.APK_S3_REGION || 'auto' }}
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      # Firebase google-services.json, pasted as plain JSON (optional). With it the app gets phone notices (components/PushSetup.js).
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: android-app/package.json

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      # Without the Firebase file the plugin is left out: registering would fail with no Firebase app.
      # No --no-save: Capacitor finds plugins through package.json, so a --no-save install is skipped (CI copy only, not committed).
      - name: Phone notices plugin (only when the Firebase file exists)
        if: env.GOOGLE_SERVICES_JSON != ''
        run: |
          npm install --no-audit --no-fund @capacitor/push-notifications@^7
          grep -q push-notifications package.json

      - name: Generate the Android project
        run: npx cap add android

      - name: Add the updater (plugin, install permission, file paths)
        run: |
          set -e
          d=android/app/src/main/java/com/vertexhash/app
          test -f "$d/MainActivity.java"
          cp native/*.java "$d/"
          m=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application#' "$m"
          grep -q REQUEST_INSTALL_PACKAGES "$m"
          printf '<?xml version="1.0" encoding="utf-8"?>\n<paths xmlns:android="http://schemas.android.com/apk/res/android">\n    <external-path name="my_images" path="." />\n    <cache-path name="my_cache_images" path="." />\n</paths>\n' > android/app/src/main/res/xml/file_paths.xml

      - name: Phone notices (Firebase file, small white icon)
        if: env.GOOGLE_SERVICES_JSON != ''
        run: |
          set -e
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          node -e "JSON.parse(require('fs').readFileSync('android/app/google-services.json','utf8'))"
          mkdir -p android/app/src/main/res/drawable
          cp native/ic_stat_vtx.xml android/app/src/main/res/drawable/
          m=android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#    <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_vtx" />\n        <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/ic_launcher_background" />\n    </application>#' "$m"
          grep -q default_notification_icon "$m"
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' "$m"
          grep -q POST_NOTIFICATIONS "$m"
          grep -q "google-services" android/app/build.gradle

      - name: App icon from the site
        run: |
          mkdir -p /tmp/icons
          if curl -fsSL "$SITE_URL/icons/512" -o /tmp/icons/icon.png && curl -fsSL "$SITE_URL/icons/maskable" -o /tmp/icons/maskable.png; then
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              dir="android/app/src/main/res/mipmap-$d"
              cp /tmp/icons/icon.png "$dir/ic_launcher.png"
              cp /tmp/icons/icon.png "$dir/ic_launcher_round.png"
              cp /tmp/icons/maskable.png "$dir/ic_launcher_foreground.png"
            done
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#0B0F1A</color>\n</resources>\n' > android/app/src/main/res/values/ic_launcher_background.xml
          else
            echo "::warning::Could not download the icons from $SITE_URL, using the default icon"
          fi

      - name: Version (code = run number, name = 1.0.<releases so far>, first = 1.0.0)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          COUNT=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '[.[] | select(.tagName | test("^app-v[0-9]+$"))] | length')
          NAME="1.0.$COUNT"
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"$NAME\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build
        working-directory: android-app/android
        run: |
          TASKS="assembleRelease"
          if [ "${{ github.event_name }}" = "pull_request" ] || [ -z "$KEYSTORE_B64" ]; then TASKS="assembleDebug $TASKS"; fi
          ./gradlew $TASKS --no-daemon --stacktrace

      - name: Collect files
        run: |
          mkdir -p out
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk out/vertexhash-debug.apk
          fi
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk out/vertexhash-release.apk

      - name: Sign release files (only when keystore secrets exist)
        if: env.KEYSTORE_B64 != ''
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          KP="${KEY_PASS:-$KEYSTORE_PASS}"
          export KEYSTORE_PASS KP
          "$BT/zipalign" -p -f 4 out/vertexhash-release.apk out/aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEYSTORE_ALIAS" \
            --ks-pass env:KEYSTORE_PASS --key-pass env:KP \
            --out out/signed.apk out/aligned.apk
          "$BT/apksigner" verify out/signed.apk
          mv -f out/signed.apk out/vertexhash-release.apk
          rm -f out/aligned.apk "$RUNNER_TEMP/release.jks"

      - name: Upload debug APK
        if: hashFiles('android-app/out/vertexhash-debug.apk') != ''
        uses: actions/upload-artifact@v5
        with:
          name: vertexhash-debug-apk
          path: android-app/out/vertexhash-debug.apk
          if-no-files-found: error

      - name: Upload release files
        uses: actions/upload-artifact@v5
        with:
          name: vertexhash-release
          path: android-app/out/vertexhash-release.apk
          if-no-files-found: error

      - name: Publish the release (signed builds on main only)
        if: env.KEYSTORE_B64 != '' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          N=${{ github.run_number }}
          sudo apt-get install -y -qq bsdiff
          PREV=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 --json tagName,isDraft,isPrerelease --jq '[.[] | select((.isDraft|not) and (.isPrerelease|not) and (.tagName|test("^app-v[0-9]+$")))][0].tagName // empty')
          ARGS=""
          if [ -n "$PREV" ]; then
            mkdir -p prev
            if gh release download "$PREV" --repo "$GITHUB_REPOSITORY" --pattern 'vertexhash-*.apk' --dir prev && ls prev/vertexhash-*.apk >/dev/null 2>&1; then
              ARGS="--prev-apk $(ls prev/vertexhash-*.apk | head -1) --prev-code ${PREV#app-v}"
            fi
          fi
          python3 tools/release.py make --code "$N" --name "$VERSION_NAME" --apk out/vertexhash-release.apk --out release $ARGS
          gh release create "app-v$N" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "App $VERSION_NAME" --notes "Android app $VERSION_NAME"

      - name: Upload to the bucket (only when the bucket secrets exist)
        if: env.KEYSTORE_B64 != '' && env.AWS_ACCESS_KEY_ID != '' && github.event_name != 'pull_request'
        run: |
          set -e
          TAG=app-v${{ github.run_number }}
          aws configure set default.s3.addressing_style virtual
          up() { aws s3 cp "$1" "s3://$BUCKET/$2" --endpoint-url "$ENDPOINT" --only-show-errors; }
          for f in release/*.apk release/*.vxp; do
            if [ -f "$f" ]; then up "$f" "$TAG/$(basename "$f")"; fi
          done
          up release/manifest.json latest.json

      # Runs after the upload, so the new version is already there. Only app-v<number>/ folders count; latest.json is never touched.
      # A failure here must not fail the release, so it only warns.
      - name: Keep the last 3 versions in the bucket
        if: env.KEYSTORE_B64 != '' && env.AWS_ACCESS_KEY_ID != '' && github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          set -e
          aws configure set default.s3.addressing_style virtual
          OLD=$(aws s3 ls "s3://$BUCKET/" --endpoint-url "$ENDPOINT" | awk '$1=="PRE" && $2 ~ /^app-v[0-9]+\/$/ {gsub(/app-v|\//,"",$2); print $2}' | sort -n | head -n -3)
          for n in $OLD; do
            echo "Deleting app-v$n"
            aws s3 rm "s3://$BUCKET/app-v$n/" --recursive --endpoint-url "$ENDPOINT" --only-show-errors
          done
