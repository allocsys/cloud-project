name: Backup

on:
  push:
    paths: ['backup/**', '.github/workflows/backup.yml']
  pull_request:
    paths: ['backup/**', '.github/workflows/backup.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
